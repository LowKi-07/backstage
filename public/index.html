      #bs-splash { position: relative; flex: 1; overflow: hidden; background: #000; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #fff; max-width: 440px; margin: 0 auto; width: 100%; }

      #bs-splash .bs-down { animation-name: bs-down; }

      #bs-splash .bs-panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 20px calc(28px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; background: #000; }
      #bs-splash .bs-panel::before { content: ''; position: absolute; left: 0; right: 0; top: -90px; height: 90px; background: linear-gradient(to bottom, rgba(0,0,0,0), #000); }
      #bs-splash h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -1px; text-align: center; }
      #bs-splash .bs-tag { margin: 0 0 8px; font-size: 15px; color: #a8a8a8; text-align: center; }
      #bs-splash .bs-label { font-size: 14px; font-weight: 600; color: #a8a8a8; }
      #bs-splash .bs-select { height: 54px; box-sizing: border-box; border-radius: 16px; border: 1px solid #333; background: #1c1c1c; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 16px; font-weight: 500; }
      #bs-splash .bs-signin { height: 54px; margin-top: 4px; border-radius: 999px; background: #fff; color: #141414; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
      #bs-splash .bs-note { margin: 4px 0 0; font-size: 12.5px; color: #8c8c8c; text-align: center; }
      @keyframes bs-up { from { transform: translateY(0); } to { transform: translateY(-808px); } }
      @keyframes bs-down { from { transform: translateY(-808px); } to { transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { #bs-splash .bs-strip { animation: none; } }
